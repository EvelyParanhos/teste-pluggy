spring:
  application:
    name: teste-pluggy
  datasource:
    url: jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

pluggy:
  client-id: ${PLUGGY_CLIENT_ID:your-client-id}
  client-secret: ${PLUGGY_CLIENT_SECRET:your-client-secret}
  base-url: https://api.pluggy.ai
